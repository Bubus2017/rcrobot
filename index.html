<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RC Robot Controller Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            font-family: 'Segoe UI', 'Orbitron', monospace;
            color: #00ffcc;
            overflow-x: hidden;
        }

        /* Efecto cyberpunk */
        .glow {
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header futurista */
        .header {
            background: rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ffcc;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        /* Tarjetas modernas */
        .card {
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            transform: translateY(-2px);
        }

        /* Joystick personalizado */
        .joystick-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .joystick {
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            border: 2px solid #00ffcc;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a0033, #000);
        }

        .joystick-thumb {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00ffcc, #0066ff);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
            transition: all 0.05s linear;
        }

        /* Botones neon */
        .btn-neon {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: monospace;
        }

        .btn-neon:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 30px #00ffcc;
            transform: scale(1.05);
        }

        /* Indicadores de estado */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .status-connected {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .status-disconnected {
            background: #ff0033;
        }

        /* Barras de progreso */
        .bar-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
        }

        .bar-fill {
            background: linear-gradient(90deg, #00ffcc, #0066ff);
            height: 100%;
            transition: width 0.05s linear;
            border-radius: 10px;
        }

        /* Grid responsivo */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Animaciones */
        @keyframes neonPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .neon-text {
            animation: neonPulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="glow">🤖 RC ROBOT CONTROLLER PRO</h1>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <div>
                    <span class="status-indicator" id="btStatus"></span>
                    <span id="btStatusText">Desconectado</span>
                </div>
                <div>
                    <span>Latencia: </span>
                    <span id="latency">0</span>
                    <span>ms</span>
                </div>
                <div>
                    <span>Señal: </span>
                    <span id="signal">0</span>
                    <span>%</span>
                </div>
            </div>
        </div>

        <!-- Controles principales -->
        <div class="grid-2">
            <!-- Joystick izquierdo -->
            <div class="card">
                <h3>🎮 CONTROL PRINCIPAL</h3>
                <div class="joystick-container">
                    <div class="joystick" id="joystickLeft">
                        <div class="joystick-base"></div>
                        <div class="joystick-thumb" id="leftThumb"></div>
                    </div>
                </div>
                <div>
                    <div>X: <span id="joyX">0</span></div>
                    <div class="bar-container">
                        <div class="bar-fill" id="barX" style="width: 0%"></div>
                    </div>
                    <div>Y: <span id="joyY">0</span></div>
                    <div class="bar-container">
                        <div class="bar-fill" id="barY" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Botones de control -->
            <div class="card">
                <h3>⚡ COMANDOS RÁPIDOS</h3>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                    <button class="btn-neon" data-cmd="F">⬆️ FORWARD</button>
                    <button class="btn-neon" data-cmd="S">⏹️ STOP</button>
                    <button class="btn-neon" data-cmd="B">⬇️ BACKWARD</button>
                    <button class="btn-neon" data-cmd="L">⬅️ LEFT</button>
                    <button class="btn-neon" data-cmd="R">➡️ RIGHT</button>
                    <button class="btn-neon" data-cmd="C">🔄 CENTER</button>
                </div>
            </div>
        </div>

        <!-- Switches y botones adicionales -->
        <div class="card">
            <h3>🔘 SWITCHES AUXILIARES</h3>
            <div class="grid-2">
                <div>
                    <div>SWITCH A</div>
                    <button class="btn-neon" data-switch="SA_UP">▲ UP</button>
                    <button class="btn-neon" data-switch="SA_DOWN">▼ DOWN</button>
                </div>
                <div>
                    <div>SWITCH B</div>
                    <button class="btn-neon" data-switch="SB_UP">▲ UP</button>
                    <button class="btn-neon" data-switch="SB_DOWN">▼ DOWN</button>
                </div>
            </div>
        </div>

        <!-- Diagnóstico -->
        <div class="card">
            <h3>📊 DIAGNÓSTICO EN TIEMPO REAL</h3>
            <pre id="debug" style="background: #000; padding: 10px; border-radius: 10px; font-size: 12px; overflow-x: auto;"></pre>
        </div>

        <!-- Botones de conexión -->
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-neon" id="connectBtn">🔌 CONECTAR BLUETOOTH</button>
            <button class="btn-neon" id="disconnectBtn">❌ DESCONECTAR</button>
        </div>
    </div>

    <script>
        // Variables globales
        let bluetoothDevice = null;
        let characteristic = null;
        let lastSendTime = 0;
        let lastCommand = "";
        let animationId = null;
        
        // Estado del joystick
        let leftX = 0, leftY = 0;
        
        // Configuración Bluetooth
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        // Inicializar joysticks
        function initJoystick(containerId, thumbId, onMove) {
            const container = document.getElementById(containerId);
            const thumb = document.getElementById(thumbId);
            let active = false;
            let centerX, centerY;
            
            const updatePosition = (clientX, clientY) => {
                const rect = container.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                
                let x = clientX - centerX;
                let y = clientY - centerY;
                
                // Limitar al radio del joystick
                const maxRadius = rect.width / 2 - 40;
                let distance = Math.sqrt(x*x + y*y);
                if (distance > maxRadius) {
                    x = x * maxRadius / distance;
                    y = y * maxRadius / distance;
                    distance = maxRadius;
                }
                
                // Normalizar valores (-100 a 100)
                const normX = (x / maxRadius) * 100;
                const normY = (y / maxRadius) * 100;
                
                // Mover thumb
                thumb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                
                onMove(normX, -normY);
            };
            
            const startDrag = (e) => {
                active = true;
                const point = e.touches ? e.touches[0] : e;
                updatePosition(point.clientX, point.clientY);
            };
            
            const onDrag = (e) => {
                if (!active) return;
                e.preventDefault();
                const point = e.touches ? e.touches[0] : e;
                updatePosition(point.clientX, point.clientY);
            };
            
            const endDrag = () => {
                active = false;
                thumb.style.transform = 'translate(-50%, -50%)';
                onMove(0, 0);
            };
            
            container.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            container.addEventListener('touchstart', startDrag);
            window.addEventListener('touchmove', onDrag);
            window.addEventListener('touchend', endDrag);
        }
        
        // Enviar comando al ESP32
        async function sendCommand(command) {
            if (!characteristic) {
                console.log("No conectado");
                return;
            }
            
            const now = Date.now();
            const latency = lastSendTime ? now - lastSendTime : 0;
            document.getElementById('latency').innerText = latency;
            
            try {
                const encoder = new TextEncoder();
                await characteristic.writeValue(encoder.encode(command + "\n"));
                lastSendTime = now;
                lastCommand = command;
                
                // Actualizar debug
                const debug = document.getElementById('debug');
                debug.innerHTML = `📤 Enviado: ${command}\n⏱️ Latencia: ${latency}ms\n🕒 ${new Date().toLocaleTimeString()}\n${debug.innerHTML}`;
                if (debug.innerHTML.split('\n').length > 20) {
                    debug.innerHTML = debug.innerHTML.split('\n').slice(0, 20).join('\n');
                }
            } catch (error) {
                console.error("Error enviando:", error);
            }
        }
        
        // Enviar comando proporcional
        function sendProportional(x, y) {
            const cmd = `M${Math.round(x)},${Math.round(y)}`;
            sendCommand(cmd);
        }
        
        // Conectar Bluetooth
        async function connectBluetooth() {
            try {
                if (!navigator.bluetooth) {
                    alert("Tu navegador no soporta Web Bluetooth. Usa Chrome o Edge en Android.");
                    return;
                }
                
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                bluetoothDevice = device;
                
                // Actualizar UI
                document.getElementById('btStatus').className = 'status-indicator status-connected';
                document.getElementById('btStatusText').innerText = 'Conectado';
                document.getElementById('signal').innerText = '100';
                
                console.log("Bluetooth conectado!");
                
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('btStatus').className = 'status-indicator status-disconnected';
                    document.getElementById('btStatusText').innerText = 'Desconectado';
                    characteristic = null;
                });
                
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("Error al conectar: " + error.message);
            }
        }
        
        // Desconectar
        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            characteristic = null;
            document.getElementById('btStatus').className = 'status-indicator status-disconnected';
            document.getElementById('btStatusText').innerText = 'Desconectado';
        }
        
        // Inicializar controles
        function initControls() {
            // Joystick izquierdo
            initJoystick('joystickLeft', 'leftThumb', (x, y) => {
                leftX = x;
                leftY = y;
                document.getElementById('joyX').innerText = Math.round(x);
                document.getElementById('joyY').innerText = Math.round(y);
                document.getElementById('barX').style.width = `${(x + 100) / 2}%`;
                document.getElementById('barY').style.width = `${(y + 100) / 2}%`;
                
                // Enviar comando proporcional
                sendProportional(x, y);
            });
            
            // Botones de comandos
            document.querySelectorAll('[data-cmd]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cmd = btn.getAttribute('data-cmd');
                    sendCommand(cmd);
                    
                    // Efecto visual
                    btn.style.transform = 'scale(0.95)';
                    setTimeout(() => btn.style.transform = '', 100);
                });
            });
            
            // Switches
            document.querySelectorAll('[data-switch]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sw = btn.getAttribute('data-switch');
                    sendCommand(sw);
                    
                    btn.style.transform = 'scale(0.95)';
                    setTimeout(() => btn.style.transform = '', 100);
                });
            });
        }
        
        // Simular intensidad de señal
        setInterval(() => {
            if (characteristic) {
                const signalStrength = Math.floor(Math.random() * 30 + 70);
                document.getElementById('signal').innerText = signalStrength;
            }
        }, 1000);
        
        // Event listeners
        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
        document.getElementById('disconnectBtn').addEventListener('click', disconnectBluetooth);
        
        // Inicializar todo
        initControls();
        
        // Prevenir zoom en móvil
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.joystick')) {
                e.preventDefault();
            }
        }, { passive: false });
        
        console.log("App lista! ✅");
    </script>
</body>
</html>
