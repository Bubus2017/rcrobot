<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROBOFUT BLE</title>

<style>

body{
background:#0a0a0a;
font-family:Arial;
text-align:center;
color:#00ffcc;
padding:20px;
}

h1{
font-size:40px;
margin-bottom:20px;
}

button{

width:120px;
height:120px;
margin:10px;
font-size:30px;
font-weight:bold;
border:none;
border-radius:20px;

background:#00ffcc;
color:black;

box-shadow:0 0 20px #00ffcc;

}

button:active{

transform:scale(0.95);

}

#status{

margin:20px;
font-size:25px;

}

</style>
</head>

<body>

<h1>🤖 ROBOFUT</h1>

<div id="status">
DESCONECTADO
</div>

<button onclick="connectBLE()">
CONECTAR
</button>

<br><br>

<button onclick="sendCommand('F')">↑</button>

<br>

<button onclick="sendCommand('L')">←</button>

<button onclick="sendCommand('S')">■</button>

<button onclick="sendCommand('R')">→</button>

<br>

<button onclick="sendCommand('B')">↓</button>

<script>

let device;
let characteristic;

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"abcdefab-1234-5678-1234-abcdefabcdef";

async function connectBLE(){

try{

device =
await navigator.bluetooth.requestDevice({

acceptAllDevices:true,

optionalServices:[SERVICE_UUID]

});

const server =
await device.gatt.connect();

const service =
await server.getPrimaryService(SERVICE_UUID);

characteristic =
await service.getCharacteristic(CHARACTERISTIC_UUID);

document.getElementById("status").innerHTML =
"✅ CONECTADO";

alert("ROBOT CONECTADO");

}catch(error){

alert(error);

console.log(error);

}

}

async function sendCommand(cmd){

if(!characteristic){

alert("NO CONECTADO");
return;

}

try{

const encoder = new TextEncoder();

await characteristic.writeValue(
encoder.encode(cmd)
);

console.log("Enviado:",cmd);

}catch(error){

console.log(error);

}

}

</script>

</body>
</html>
